# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window
# 
# bind -n M-1 select-window -t 1
# bind -n M-2 select-window -t 2
# bind -n M-3 select-window -t 3
# bind -n M-4 select-window -t 4
# bind -n M-5 select-window -t 5
# bind -n M-6 select-window -t 6
# bind -n M-7 select-window -t 7
# bind -n M-8 select-window -t 8
# bind -n M-9 select-window -t 9
 
bind -n M-q select-window -t 1
bind -n M-w select-window -t 2
bind -n M-e select-window -t 3
bind -n M-r select-window -t 4
bind -n M-t select-window -t 5
bind -n M-y select-window -t 6
bind -n M-u select-window -t 7
bind -n M-i select-window -t 8
bind -n M-o select-window -t 9
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-j switch-client -p
bind -n M-k switch-client -n


bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1

bind -n M-! move-window -a -t 1: \; switch-client -t 1
bind -n M-@ move-window -a -t 2: \; switch-client -t 2
bind -n M-# move-window -a -t 3: \; switch-client -t 3
bind -n M-$ move-window -a -t 4: \; switch-client -t 4
bind -n M-% move-window -a -t 5: \; switch-client -t 5
bind -n M-^ move-window -a -t 6: \; switch-client -t 6
bind -n M-& move-window -a -t 7: \; switch-client -t 7
bind -n M-* move-window -a -t 8: \; switch-client -t 8
bind -n M-( move-window -a -t 9: \; switch-client -t 9

bind -n M-0 if-shell "tmux has-session -t 0" "switch-client -t 0" "new-session -ds 0 \; switch-client -t 0"
bind -n M-1 if-shell "tmux has-session -t 1" "switch-client -t 1" "new-session -ds 1 \; switch-client -t 1"
bind -n M-2 if-shell "tmux has-session -t 2" "switch-client -t 2" "new-session -ds 2 \; switch-client -t 2"
bind -n M-3 if-shell "tmux has-session -t 3" "switch-client -t 3" "new-session -ds 3 \; switch-client -t 3"
bind -n M-4 if-shell "tmux has-session -t 4" "switch-client -t 4" "new-session -ds 4 \; switch-client -t 4"
bind -n M-5 if-shell "tmux has-session -t 5" "switch-client -t 5" "new-session -ds 5 \; switch-client -t 5"
bind -n M-6 if-shell "tmux has-session -t 6" "switch-client -t 6" "new-session -ds 6 \; switch-client -t 6"
bind -n M-7 if-shell "tmux has-session -t 7" "switch-client -t 7" "new-session -ds 7 \; switch-client -t 7"
bind -n M-8 if-shell "tmux has-session -t 8" "switch-client -t 8" "new-session -ds 8 \; switch-client -t 8"
bind -n M-9 if-shell "tmux has-session -t 9" "switch-client -t 9" "new-session -ds 9 \; switch-client -t 9"

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-overrides ",*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?client_prefix,PREFIX ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

set -g window-style "bg=terminal"
set -g window-active-style "bg=terminal"
set -g pane-border-lines heavy
set -g pane-border-indicators colour

